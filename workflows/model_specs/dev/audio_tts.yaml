# =============================================================================
# Speaker diarization templates
# =============================================================================
- weights:
    - pyannote/speaker-diarization-community-1
  impl: pyannote_diarization
  min_disk_gb: 15
  min_ram_gb: 6
  model_type: DIARIZATION
  inference_engine: MEDIA
  device_model_specs:
    - device: P150
      max_concurrency: 1
      max_context: 65536  # 64 * 1024
      default_impl: true
      env_vars:
        TT_MESH_GRAPH_DESC_PATH: "../../tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_mesh_graph_descriptor.textproto"
        # Offload the embedding net only. The segmentation net is short-lived and
        # offloading it costs more than it saves, so it stays on the host; set
        # this to 1 for device coverage of both nets. Declared here because the
        # host environment does not reach the container -- only what run.py puts
        # on the docker command does, and that is model_spec.env_vars plus
        # MODEL/DEVICE.
        DIARIZATION_TT_SEGMENTATION: "0"
  status: COMPLETE

